# Локальный стенд ДЗ 11: один узел kind (control-plane = рабочий узел).
# Экономия памяти на 14,8 ГБ машине: без ingress-контроллера и лишних
# компонентов; доступ к сервисам — kubectl port-forward.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hw11
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: KubeProxyConfiguration
    mode: iptables
