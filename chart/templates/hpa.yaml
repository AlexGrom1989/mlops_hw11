{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hw11-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      # Окно стабилизации: после снижения нагрузки возврат к минимуму
      # не мгновенный (фактическая длительность фиксируется в опыте C).
      stabilizationWindowSeconds: {{ .Values.autoscaling.stabilizationWindowSeconds }}
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleUp:
      policies:
      - type: Pods
        value: 1
        periodSeconds: 30
{{- end }}
