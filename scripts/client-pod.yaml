apiVersion: batch/v1
kind: Job
metadata:
  name: loadgen
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: loadgen
      annotations:
        prometheus.io/scrape: "false"
    spec:
      restartPolicy: Never
      containers:
      - name: loadgen
        image: hw11-loadgen:v5
        imagePullPolicy: IfNotPresent
        env:
        - name: LG_ARGS
          value: "--url http://hw11-service:8000 --rps 0.25 --duration 120 --stream --sessions 16"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {memory: 128Mi}
