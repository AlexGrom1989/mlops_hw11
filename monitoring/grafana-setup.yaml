# Grafana provisioning: datasource Prometheus + наш дашборд из ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://monitoring-prometheus-server.monitoring:9090
      isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-providers
  namespace: monitoring
data:
  providers.yaml: |
    apiVersion: 1
    providers:
    - name: hw11
      folder: HW11
      type: file
      options:
        path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-hw11
  namespace: monitoring
data:
  hw11.json: |
    {"title":"HW11 сервис: очередь, TTFC, масштабирование","uid":"hw11-sim","refresh":"10s","time":{"from":"now-30m","to":"now"},
     "panels":[
      {"type":"timeseries","title":"TTFC p50/p95 (гистограмма, PromQL classic)","gridPos":{"x":0,"y":0,"w":12,"h":8},
       "targets":[{"expr":"histogram_quantile(0.95, sum by (le) (rate(sim_ttfc_seconds_bucket[1m])))","legendFormat":"p95"},{"expr":"histogram_quantile(0.50, sum by (le) (rate(sim_ttfc_seconds_bucket[1m])))","legendFormat":"p50"}]},
      {"type":"timeseries","title":"Полный ответ p95","gridPos":{"x":12,"y":0,"w":12,"h":8},
       "targets":[{"expr":"histogram_quantile(0.95, sum by (le) (rate(sim_full_seconds_bucket[1m])))","legendFormat":"p95"}]},
      {"type":"timeseries","title":"running/waiting по Pod","gridPos":{"x":0,"y":8,"w":12,"h":8},
       "targets":[{"expr":"sum by (pod) (sim_running)","legendFormat":"running {{pod}}"},{"expr":"sum by (pod) (sim_waiting)","legendFormat":"waiting {{pod}}"}]},
      {"type":"timeseries","title":"Завершённые/с и ошибки","gridPos":{"x":12,"y":8,"w":12,"h":8},
       "targets":[{"expr":"sum(rate(sim_requests_total{outcome=\"ok\"}[1m]))","legendFormat":"ok/с"},{"expr":"sum(rate(sim_requests_total{outcome=\"rejected\"}[1m]))","legendFormat":"rejected/с"},{"expr":"sum(rate(sim_requests_total{outcome=\"interrupted\"}[1m]))","legendFormat":"interrupted/с"}]},
      {"type":"timeseries","title":"CPU и RAM подов сервиса","gridPos":{"x":0,"y":16,"w":12,"h":8},
       "targets":[{"expr":"sum by (pod) (rate(container_cpu_usage_seconds_total{pod=~\"hw11-service.*\",container!=\"\"}[1m]))","legendFormat":"cpu {{pod}}"},{"expr":"sum by (pod) (container_memory_working_set_bytes{pod=~\"hw11-service.*\",container!=\"\"})","legendFormat":"ram {{pod}}"}]},
      {"type":"stat","title":"Ready-реплики","gridPos":{"x":12,"y":16,"w":6,"h":8},
       "targets":[{"expr":"kube_deployment_status_replicas_available{deployment=\"hw11-service\"}"}]},
      {"type":"stat","title":"Реплики желаемые (HPA)","gridPos":{"x":18,"y":16,"w":6,"h":8},
       "targets":[{"expr":"kube_deployment_spec_replicas{deployment=\"hw11-service\"}"}]}
     ]}
